[package]
name = "sordino"
version = "0.4.3"
edition = "2021"
description = "Studio-clean voice for Discord, Zoom and games on Windows"

[dependencies]
nnnoiseless = { version = "0.5", default-features = false }
wasapi = "0.27"
tray-icon = "0.26"
tao = "0.37"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
anyhow = "1"
log = "0.4"
windows-core = "0.62"
tract-onnx = "0.23"
realfft = "3"

[features]
# Compile the DPDFNet models into the exe (about 45 MB). Off by default: the installer downloads
# the models the user selects into %LOCALAPPDATA%\Sordino\models instead.
embed-models = []

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Console",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"


[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
